<style>
/* Layout: one scrolling list grouped by series, sticky search on top, sticky totals bar at bottom; order sheet as an overlay */
:root{
  --bg:#eef1f3; --surface:#ffffff; --line:#d5dbe0; --fg:#1d2730; --muted:#5d6b77;
  --accent:#0e6e8c; --accent-ink:#ffffff; --hit:#fff4d6; --hit-line:#e8b94a; --danger:#b3261e;
  --display:"Rubik","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181d; --surface:#1b232a; --line:#2c3842; --fg:#e4eaef; --muted:#93a2ae;
  --accent:#4fb3d4; --accent-ink:#06222c; --hit:#2e2a1c; --hit-line:#b48a2c; --danger:#f2867d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181d; --surface:#1b232a; --line:#2c3842; --fg:#e4eaef; --muted:#93a2ae;
  --accent:#4fb3d4; --accent-ink:#06222c; --hit:#2e2a1c; --hit-line:#b48a2c; --danger:#f2867d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
h1{font-family:var(--display);font-size:1.25rem;margin:0;text-wrap:balance}
h1 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem;margin-inline-start:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 220px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.chip{font:inherit;font-size:.9rem;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
nav.jump a{flex:0 0 auto;font-size:.82rem;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
section{margin-top:18px}
section h2{font-family:var(--display);font-size:1rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 span{font-family:var(--body);font-size:.82rem;color:var(--muted);font-weight:400}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:3.4rem 3.4rem 1fr;grid-template-areas:"pic code info" "pic qty qty";gap:6px 10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.pic{grid-area:pic}.code{grid-area:code}.info{grid-area:info}.qty{grid-area:qty;justify-content:flex-start}

.row:first-child{border-top:0}
.row.on{background:var(--hit);box-shadow:inset -4px 0 0 var(--hit-line)}
.pic{width:3.4rem;height:2.6rem;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;border:1px solid var(--line)}
.pic img{max-width:3.1rem;max-height:2.4rem}
.code{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem}
.info{min-width:0}
.desc{line-height:1.25}
.len{font:inherit;font-size:.78rem;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.meta{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums} .meta .np{color:#b4460b}
.qty{display:flex;align-items:center;gap:4px}

.empty{padding:24px;text-align:center;color:var(--muted)}
.bar{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.tot{font-variant-numeric:tabular-nums;font-size:.95rem}
.tot b{font-family:var(--display)}

.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--danger);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#sheet .wrap{padding-block:16px 40px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.fields label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.fields input{font:inherit;color:var(--fg);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.d{white-space:normal;min-width:11rem}
th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
tfoot td{font-weight:700;border-bottom:0}
td.i img{max-width:3rem;max-height:2.4rem;display:block;margin:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:.85rem;color:var(--muted);margin-top:8px}
#confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
pre#txt{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.85rem;margin-top:12px}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
#print{position:absolute;left:-10000px;top:0;width:794px;background:#fff;color:#000;font-family:"Assistant",system-ui,sans-serif;direction:rtl;padding:36px 40px}
#print .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:8px}
#print .ph b{font-size:20px} #print .pt{text-align:center;font-size:18px;font-weight:700;text-decoration:underline;margin:14px 0 8px}
#print .pf{display:flex;gap:28px;margin:8px 0 12px;font-size:14px} #print .pf span{flex:1;border-bottom:1px solid #000;padding-bottom:3px}
#print table{width:100%;border-collapse:collapse;font-size:13px} #print th,#print td{border:1px solid #000;padding:4px 6px;text-align:center;vertical-align:middle}
#print th{background:#e6e6e6;font-size:12px} #print td.d{text-align:right} #print td.c{font-weight:700;font-size:15px}
#print td.i{width:62px;height:44px;padding:2px} #print td.i img{max-width:58px;max-height:40px}
#print .pfoot{display:flex;justify-content:space-between;margin-top:14px;font-size:14px;font-weight:700}
.modes{display:flex;gap:6px}
.modes .chip{flex:1;text-align:center;font-weight:600}
.colors{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

.stock{grid-area:qty;display:flex;align-items:center;gap:8px;justify-content:flex-start}

.stock .mn{font-size:.75rem;color:var(--muted)}
.row.low{box-shadow:inset -4px 0 0 var(--danger)}

.status{font-size:.8rem;color:var(--muted)}

      rows.map(([p, s, d]) => {

}
async function parseAlkal(buf) {
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({ data: buf }).promise;
  const lines = [], unknown = []; let ref = '', color = '';
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    const toks = tc.items.filter(t => t.str.trim()).map(t => ({ s: t.str.trim(), x: t.transform[4], y: t.transform[5] })).sort((a, b) => b.y - a.y);
    const rows = [];
    toks.forEach(t => { let r = rows.find(r => Math.abs(r.y - t.y) < 4); if (!r) { r = { y: t.y, t: [] }; rows.push(r); } r.t.push(t); });
    rows.forEach(r => {
      const txt = r.t.map(t => t.s).join(' ');
      if (!ref && /פרופילים/.test(txt)) { const m = txt.match(/\b(\d{4,5})\b/); if (m) ref = m[1]; }
      if (!color && /אילגון/.test(txt)) { const f = COLORS.find(c => txt.includes(c.split(' ')[0])); if (f) color = f; }
      const nums = r.t.filter(t => /^\d+(\.\d+)?$/.test(t.s));
      const len = nums.find(t => /^\d{4}$/.test(t.s) && +t.s >= 3000 && +t.s <= 7500); if (!len) return;
      const left = nums.filter(t => t.x < len.x).sort((a, b) => b.x - a.x); const qty = left[0];
      if (!qty || !/^\d+$/.test(qty.s) || +qty.s <= 0) return;
      const right = nums.filter(t => t !== len && t.x > len.x).sort((a, b) => a.x - b.x);
      const code = right.find(t => WN[np(t.s)]);
      if (code) lines.push({ p: code.s, n: +qty.s });
      else { const cand = right.find(t => t.s.length >= 3); unknown.push(cand ? cand.s : txt); }
    });
  }
  return { lines, unknown, ref, color };
}
